# Fast-compile setup from the Bevy setup guide: link with LLD through clang (much faster than the default GNU ld).
# Dynamic linking of Bevy is on by default through the `dev` feature in Cargo.toml.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Windows release builds cross-compiled from WSL (apt package mingw-w64).
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
